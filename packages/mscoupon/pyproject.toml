[build-system]
requires = ["scikit-build-core>=0.9", "pybind11>=2.13"]
build-backend = "scikit_build_core.build"

[project]
name = "msseg-mscoupon"
version = "0.1.0"
description = "MSSeg mscoupon: 2D TIFF-slice Morse-Smale segmentation + coupon analysis CLI."
requires-python = ">=3.9"
# numpy is needed by the pybind API; the rest power the `mscoupon` analysis CLI
# and the `mscoupon-gui` Tkinter viewer (matplotlib for the merge-tree icicle,
# msseg-viz for the shared palette/icicle, large-image for pyramidal TIFF display).
dependencies = [
  "numpy", "scipy", "pandas", "tifffile", "pillow", "bokeh",
  # large-image[tiff] gives the libtiff tiled/pyramidal source; [tifffile] adds a
  # source that also reads plain (non-tiled) TIFF slices, so a typical sequence
  # opens pyramidally too (otherwise the canvas falls back to in-memory display).
  "matplotlib", "msseg-viz", "large-image[tiff,tifffile]",
]

[project.optional-dependencies]
# The labeler's Train/Classify buttons (random forest); everything else works
# without it, and the import is lazy with a status-bar hint when missing.
classify = ["scikit-learn"]

[project.scripts]
mscoupon = "msseg.mscoupon.analysis:main"
mscoupon-gui = "msseg.mscoupon.app:main"
mscoupon-labeler = "msseg.mscoupon.labeler:main"

[tool.scikit-build]
# src-layout: ship msseg/mscoupon/ (namespace package, no msseg/__init__.py).
# The compiled mscoupon_py extension is installed alongside by CMake below.
wheel.packages = ["src/msseg"]
# Keep dev artifacts out of the distribution. These filter the *source* copy
# only (scikit-build-core passes sdist.exclude as the package walk's
# src_exclude), so the CMake-installed extension is untouched -- wheel.exclude
# would also match it, since that one is applied to the CMake output as well.
sdist.exclude = [
  # In-place builds of the extension for whatever interpreter the dev happens
  # to run land beside the sources; the wheel's copy comes from CMake install.
  "**/*.pyd",
  "**/__pycache__",
  # Measurement outputs committed next to the measure_*/plot_* scripts that
  # produced them; they are CLI arguments in those docstrings, not package data.
  "**/mscoupon/*.csv",
  "**/mscoupon/*.png",
  "**/mscoupon/*.ps1",
]
cmake.version = ">=3.21"
# Only install our pybind module into the wheel (keeps FetchContent deps' own
# install() output out).
install.components = ["msseg_python"]

[tool.scikit-build.cmake.define]
MSSEG_BUILD_PYTHON = "ON"
MSSEG_BUILD_VIEWER = "OFF"
MSSEG_BUILD_TESTS = "OFF"
